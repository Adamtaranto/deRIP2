name: Ruff Formatting
on: [pull_request]
jobs:
  ruff:
    if: ${{ github.actor != 'dependabot[bot]' }} # Do not run on commits created by dependabot
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed files.
      contents: write # Allows reading and writing repository contents (e.g., commits)
      pull-requests: write # Allows reading and writing pull requests
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./src ./tests"
          args: "format"
      # Import sorting is handled by ruff's I001 rule (configured under
      # [tool.ruff.lint.isort] in pyproject.toml), so there is no separate isort
      # step. Keeping one here would reintroduce the split that let imports pass
      # pre-commit locally and still be rewritten on push.
      - uses: astral-sh/ruff-action@v3
        with:
          src: "./src ./tests"
          args: "check --fix"
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: auto-commit-action
        with:
          commit_message: "Style fixes by Ruff"
