name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write
# Allow one concurrent deployment; skip runs queued behind a newer one.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Install the package (so mkdocstrings can import derip2) plus the docs
      # toolchain (zensical, mkdocstrings) from the `docs` extra.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[docs]'
      - name: Build site with Zensical
        run: zensical build --clean --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
