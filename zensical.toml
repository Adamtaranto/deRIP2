# Zensical configuration for the deRIP2 documentation.
# Ported from the former mkdocs.yml (Material for MkDocs). Build with:
#   zensical build --clean     # writes the static site to ./site
#   zensical serve             # local preview with live reload
# Docs: https://zensical.org/docs/

[project]
site_name = "deRIP2"
site_description = "Predict ancestral fungal transposon sequences by correcting for RIP-like mutations"
site_author = "adamtaranto"
site_url = "https://adamtaranto.github.io/deRIP2/"
repo_name = "adamtaranto/deRIP2"
repo_url = "https://github.com/adamtaranto/deRIP2"
edit_uri = ""
use_directory_urls = true

nav = [
  { "Getting Started" = "index.md" },
  { "Colab demo notebook" = "tutorial.md" },
  { "RIP Strand Bias" = "tutorials/rip-strand-bias.md" },
  { "RIP Masking & Phylogeny" = "tutorials/rip-masking-phylogeny.md" },
  { "Mutation Spectra" = "tutorials/mutation-spectra.md" },
  { "Flank-context Spectra (API)" = "tutorials/flank-context-spectra.md" },
  { "Combined Spectra (API)" = "tutorials/combined-spectra.md" },
  { "Per-sequence Reporting" = "tutorials/per-sequence-reporting.md" },
  { "API Docs" = "api-docs/deRIP_API.md" },
  { "CLI Docs" = "cli-docs/deRIP_cmd_line.md" },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
# Zensical ships two variants: "modern" (default) and "classic" (the
# traditional Material for MkDocs look). Uncomment to switch to the classic look.
[project.theme]
#variant = "classic"
language = "en"
features = [
  "navigation.top",
  "navigation.expand",
  "navigation.sections",
  "navigation.tabs.sticky",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions (ported from mkdocs.yml)
# ----------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
# Search is built in to Zensical and enabled by default.
# mkdocstrings is not bundled with Zensical; install it separately
# (it is included in the `docs` extra in pyproject.toml).
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
# Heading options
heading_level = 2
show_root_full_path = false
show_root_heading = true
# Member options
members_order = "source"
# Docstrings options
docstring_style = "numpy"
docstring_section_style = "spacy"
line_length = 89
merge_init_into_class = true
# Signature/annotation options
show_signature_annotations = true
separate_signature = true
# Additional options
show_source = false
